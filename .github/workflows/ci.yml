name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Na main nao cancela: interromperia a publicacao da imagem.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verificacoes:
    # Push cobre todo commit de toda branch. O gatilho de pull_request fica so
    # para PR vindo de fork, onde o evento de push nao chega a este repositorio.
    # Sem esta condicao, todo commit de branch com PR aberto rodaria duas vezes.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Lint, testes e build
    runs-on: ubuntu-latest

    env:
      # O build interrompe de proposito quando esta variavel falta, para que um
      # deploy nao suba com a URL da API indefinida. Aqui o valor so precisa ser
      # valido: nada e publicado, e nenhuma requisicao sai.
      VITE_API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cobre lint e formatacao: o Prettier roda como regra do ESLint.
      - run: npm run lint

      - run: npm test

      - run: npm run build

  publicar:
    name: Publicar imagem
    needs: verificacoes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sem build-arg: o Dockerfile usa VITE_API_URL=/api, e a mesma imagem
      # serve qualquer endereco de servidor.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kaegg/tcc-frontend:latest
            ghcr.io/kaegg/tcc-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

