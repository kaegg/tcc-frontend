name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Na main nao cancela: interromperia um deploy em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verificacoes:
    # Push cobre todo commit de toda branch. O gatilho de pull_request fica so
    # para PR vindo de fork, onde o evento de push nao chega a este repositorio.
    # Sem esta condicao, todo commit de branch com PR aberto rodaria duas vezes.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Lint, testes e build
    runs-on: ubuntu-latest

    env:
      # O build interrompe de proposito quando esta variavel falta, para que um
      # deploy nao suba com a URL da API indefinida. Aqui o valor so precisa ser
      # valido: nada e publicado, e nenhuma requisicao sai.
      VITE_API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cobre lint e formatacao: o Prettier roda como regra do ESLint.
      - run: npm run lint

      - run: npm test

      - run: npm run build

  publicar:
    name: Publicar imagem
    needs: verificacoes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sem build-arg: o Dockerfile usa VITE_API_URL=/api, e a mesma imagem
      # serve qualquer endereco de servidor.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kaegg/tcc-frontend:latest
            ghcr.io/kaegg/tcc-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy
    needs: publicar
    # DEPLOY_ENABLED (variavel do repositorio) liga o deploy e serve de pausa,
    # por exemplo durante as sessoes do estudo de usabilidade.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      # known_hosts vem de segredo, nunca de ssh-keyscan no runner: aceitar a
      # chave que o host apresentar abriria espaco para um servidor falso.
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # O compose e o deploy.sh vivem no repositorio do backend; o deploy dele
      # os mantem atualizados no servidor. Aqui so o container `web` muda.
      - name: Atualizar frontend
        run: ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$TARGET" "sh '$DEPLOY_PATH/deploy.sh' web"
